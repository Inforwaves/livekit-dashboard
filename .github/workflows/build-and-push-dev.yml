name: Build and Deploy Articom Livekit Dashboard (Dev)

on:
  push:
    branches:
      - dev
  workflow_dispatch:

env:
  IMAGE_NAME: articom-livekit-dashboard
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GAR_LOCATION: ${{ vars.GCP_REGION }}
  GAR_REPOSITORY: ${{ vars.GAR_REPOSITORY }}
  GKE_CLUSTER: ${{ vars.GKE_CLUSTER }}
  GKE_ZONE: ${{ vars.GKE_ZONE }}
  SERVICE_NAME: articom-livekit-dashboard
  GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}

jobs:
  build-dev:
    name: Build & Push (dev)
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ env.GCP_SA_KEY }}

      - name: Login to Private Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GAR_LOCATION }}-docker.pkg.dev
          username: _json_key
          password: ${{ env.GCP_SA_KEY }}

      - name: Build and Push Docker Image (dev)
        run: |
          IMAGE_TAG=dev
          REGISTRY_URL="${GAR_LOCATION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GAR_REPOSITORY}/${IMAGE_NAME}"
          docker build -t "$REGISTRY_URL:$IMAGE_TAG" .
          docker push "$REGISTRY_URL:$IMAGE_TAG"

      - name: Get GKE Credentials (dev)
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_ZONE }}

      - name: Ensure K8s Image Pull Secret for Private Registry (dev)
        run: |
          kubectl create secret docker-registry gar-json-key \
            --namespace=dev \
            --docker-server="${GAR_LOCATION}-docker.pkg.dev" \
            --docker-username=_json_key \
            --docker-password="$GCP_SA_KEY" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Rollout restart (dev)
        run: |
          kubectl rollout restart deployment $SERVICE_NAME -n dev
          kubectl rollout status deployment $SERVICE_NAME -n dev
