name: Build and Deploy Articom Livekit Dashboard (Prod)

on:
  release:
    types: [published]
  workflow_dispatch:

env:
  IMAGE_NAME: articom-livekit-dashboard
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GAR_LOCATION: ${{ vars.GCP_REGION }}
  GAR_REPOSITORY: ${{ vars.GAR_REPOSITORY }}
  GKE_CLUSTER: ${{ vars.GKE_CLUSTER }}
  GKE_ZONE: ${{ vars.GKE_ZONE }}
  SERVICE_NAME: articom-livekit-dashboard
  GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}

jobs:
  build-main-release:
    name: Build & Push (prod)
    runs-on: ubuntu-latest
    environment: prod
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'release' && github.event.action == 'published')

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ env.GCP_SA_KEY }}

      - name: Login to Private Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GAR_LOCATION }}-docker.pkg.dev
          username: _json_key
          password: ${{ env.GCP_SA_KEY }}

      - name: Build and Push Docker Image (release)
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            RELEASE_TAG="${{ github.event.release.tag_name }}"
          else
            RELEASE_TAG="latest"
          fi
          REGISTRY_URL="${GAR_LOCATION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GAR_REPOSITORY}/${IMAGE_NAME}"
          echo "Building release image: $REGISTRY_URL:$RELEASE_TAG"

          docker build -t "$REGISTRY_URL:$RELEASE_TAG" .

          docker push "$REGISTRY_URL:$RELEASE_TAG"

          docker tag "$REGISTRY_URL:$RELEASE_TAG" "$REGISTRY_URL:latest"
          docker push "$REGISTRY_URL:latest"

          echo "Images $RELEASE_TAG and latest pushed successfully to Artifact Registry"

      - name: Get GKE Credentials (prod)
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_ZONE }}

      - name: Ensure K8s Image Pull Secret for Private Registry (prod)
        run: |
          kubectl create secret docker-registry gar-json-key \
            --namespace=prod \
            --docker-server="${GAR_LOCATION}-docker.pkg.dev" \
            --docker-username=_json_key \
            --docker-password="$GCP_SA_KEY" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Rollout restart (prod)
        run: |
          kubectl rollout restart deployment $SERVICE_NAME -n prod
          kubectl rollout status deployment $SERVICE_NAME -n prod
